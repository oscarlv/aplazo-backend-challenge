version: "3.9"

services:

  challenge-service:
    build: .
    container_name: challenge-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/aplazodb
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=secretadmin
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11.3
    container_name: aplazo-mariadb
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secretadmin
      - MYSQL_DATABASE=aplazodb
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=secretadmin
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mariadb-data:
